[project]
name = "ha-daly-bms-usb"
version = "0.1.0"
description = "Home Assistant custom integration for Daly LiFePO4 BMS via UART/USB."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
  "dalybms==0.5.0",
  "pyserial==3.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.10",
  "voluptuous>=0.15",
  "homeassistant>=2024.11.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
  "E", "F", "W", "I", "B", "UP", "SIM", "PL", "N",
]
ignore = [
  "PLR0913",  # too many args (HA config flows have wide signatures)
  "PLR2004",  # magic-value comparisons in tests
  "PLR0911",  # too many returns
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PLR2004", "N802", "PLC0415", "E501"]
"custom_components/daly_bms_usb/config_flow.py" = ["PLC0415"]
"custom_components/daly_bms_usb/client.py" = ["N818"]
"custom_components/daly_bms_usb/diagnostics.py" = ["PLC0415"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
  "ignore::DeprecationWarning",
]

[tool.mypy]
python_version = "3.14"
strict = false
warn_unused_ignores = true
ignore_missing_imports = true
follow_imports = "silent"
disable_error_code = ["import-untyped"]
